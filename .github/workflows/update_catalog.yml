name: Update Model Catalogs

on:
  schedule:
    # Every Monday at 3:00 AM UTC (11:00 AM JST)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  deployments: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run catalog update
        working-directory: ./scripts
        run: |
          set -x  # Enable command echoing for debugging
          echo "🚀 Starting catalog update..."
          echo "Python version: $(python --version 2>&1 || python3 --version)"

          echo "📊 Gunpla (Bandai)..."
          python -u scrape_gunpla.py || python3 -u scrape_gunpla.py

          # SKIPPED: fill_jan_hobbysearch.py - HobbySearch rate limiting causes timeouts
          python -u normalize_series.py || python3 -u normalize_series.py

          echo "📊 Other manufacturers (Kotobukiya, Tamiya, Hasegawa)..."
          python -u scrape_hobbysearch_all.py || python3 -u scrape_hobbysearch_all.py

          echo "✅ Catalog update complete"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet gunpla_catalog.csv kotobukiya_models.csv tamiya_military.csv hasegawa_aircraft.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes to catalogs"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📊 Catalogs updated"
            echo "Changed files:"
            git diff --name-only
            git diff --stat gunpla_catalog.csv kotobukiya_models.csv tamiya_military.csv hasegawa_aircraft.csv 2>/dev/null || true
          fi

      - name: Create Release with Assets (if changed)
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: catalog-${{ github.run_number }}-${{ github.run_id }}
          name: Catalog Update - ${{ github.run_number }}
          body: |
            Automated model catalog update

            **Files included:**
            - gunpla_catalog.csv - Gundam Plastic Models from Bandai (Wikipedia + normalized)
            - kotobukiya_models.csv - Kotobukiya models
            - tamiya_military.csv - Tamiya military miniatures
            - hasegawa_aircraft.csv - Hasegawa aircraft models

            Generated at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          draft: false
          prerelease: false
          files: |
            gunpla_catalog.csv
            kotobukiya_models.csv
            tamiya_military.csv
            hasegawa_aircraft.csv

      - name: Commit changes (if changed)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gunpla_catalog.csv kotobukiya_models.csv tamiya_military.csv hasegawa_aircraft.csv
          git commit -m "chore: update model catalogs - $(date +'%Y-%m-%d')"
          git push

      - name: Notify (no changes)
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "✅ Catalog check completed - no updates needed"
